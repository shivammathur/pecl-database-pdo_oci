name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  linux:
    name: linux (${{ matrix.version }}, ${{ matrix.oracle }}${{ matrix.asan && ', ASAN' || '' }})
    strategy:
      fail-fast: false
      matrix:
        version: [8.3, 8.4, 8.5, 8.6, master]
        oracle: [18, 21, 23]
        asan: [false]
        include:
          # Test Oracle 11 with PHP 8.3 only
          # https://github.com/php/php-src/pull/18734
          # https://github.com/php/pecl-database-pdo_oci/pull/16#discussion_r2119810891
          - version: 8.3
            oracle: 11
            image: wnameless/oracle-xe-11g-r2
            port: 1511
            options: --name=oci
          - oracle: 18
            image: gvenzl/oracle-xe:18-slim-faststart
            port: 1518
            options: --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 10
          - oracle: 21
            image: gvenzl/oracle-xe:21-slim-faststart
            port: 1521
            options: --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 10
          - oracle: 23
            image: gvenzl/oracle-free:23-slim
            port: 1523
            options: --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 10
          - version: 8.5
            oracle: 21
            asan: true
            image: gvenzl/oracle-xe:21-slim-faststart
            port: 1521
            options: --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 10
    
    services:
      oracle:
        image: ${{ matrix.image }}
        ports:
          - ${{ matrix.port }}:1521
        env:
          ORACLE_ALLOW_REMOTE: true
          ORACLE_PASSWORD: oracle
        options: ${{ matrix.options }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup dependencies
        run: |
          mkdir -p /opt/oracle
          for pkg in sdk basiclite; do
            curl --no-progress-meter -O https://download.oracle.com/otn_software/linux/instantclient/instantclient-$pkg-linuxx64.zip
            unzip -q -o instantclient-$pkg-linuxx64.zip -d /opt/oracle
          done
          mv /opt/oracle/instantclient_* /opt/oracle/instantclient
          sudo ln -sf /opt/oracle/instantclient/*.so* /usr/lib
          sudo apt-get -q update && sudo apt-get install libaio-dev -y
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1 >/dev/null 2>&1 || true
          # fix debug build warning: zend_signal: handler was replaced for signal (2) after startup
          echo DISABLE_INTERRUPT=on > /opt/oracle/instantclient/network/admin/sqlnet.ora
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup PHP
        id: setup-php
        uses: shivammathur/setup-php@develop
        with:
          php-version: ${{matrix.version}}
          extensions: ${{ matrix.asan && 'none, pdo, mbstring, simplexml' || '' }}
        env:
          asan: ${{ matrix.asan }}
      - name: Set ASAN build flags
        if: matrix.asan
        run: |
          echo 'CFLAGS=-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined' >> "$GITHUB_ENV"
          echo 'LDFLAGS=-fsanitize=address,undefined' >> "$GITHUB_ENV"
      - name: Build
        run: |
          phpize
          ./configure --with-php-config=$(command -v php-config) --with-pdo-oci=instantclient,/opt/oracle/instantclient
          make -j$(nproc)
          sudo make install
          version=$(php-config --version | cut -d. -f1,2)
          if [[ -s "/etc/php/$version/COMMIT" ]]; then
            echo "PHP_SRC_COMMIT=$(cat "/etc/php/$version/COMMIT")" >> "$GITHUB_ENV"
          fi
          echo 'extension=pdo_oci.so' | sudo tee "/etc/php/$version/mods-available/pdo_oci.ini"
          sudo phpenmod -v "$version" pdo_oci
          php --ri pdo_oci
      - name: Verify ASAN instrumentation
        if: matrix.asan
        run: |
          [[ $(php-config --extension-dir) == *-asan ]]
          nm -D modules/pdo_oci.so | grep ' U __asan_report_' > /dev/null
      - name: Checkout php-src
        uses: actions/checkout@v6
        with:
          repository: php/php-src
          ref: ${{ env.PHP_SRC_COMMIT || format('php-{0}', steps.setup-php.outputs.php-version) }}
          path: php-src
      - name: Remove unsupported php-src tests
        run: |
          # Test gh20553.phpt is not compatible with Oracle.
          # SELECT <literals> without a FROM clause is not supported in Oracle (ORA-00923).
          rm -rf php-src/ext/pdo/tests/gh20553.phpt
      - name: Run tests /w Oracle ${{ matrix.oracle }}
        run: php php-src/run-tests.php ${{ matrix.asan && '--asan' || '' }} --show-diff --show-slow 1000 --set-timeout 120 tests
        env:
          ASAN_OPTIONS: ${{ matrix.asan && 'detect_leaks=1' || env.ASAN_OPTIONS }}
          PDO_TEST_DIR: ${{ github.workspace }}/php-src/ext/pdo/tests
          PDO_OCI_TEST_DIR: ${{ github.workspace }}/tests
          PDO_OCI_TEST_USER: system
          PDO_OCI_TEST_PASS: oracle
          PDO_OCI_TEST_DSN: oci:dbname=0.0.0.0:${{ matrix.port }}/${{ matrix.oracle == 23 && 'FREEPDB1' || 'XE' }};charset=AL32UTF8      

  windows-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.extension-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Create matrix
        id: extension-matrix
        uses: php/php-windows-builder/extension-matrix@v1
        with:
          php-version-list: '8.3, 8.4, 8.5, 8.6'

  windows:
    needs: windows-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.windows-matrix.outputs.matrix)}}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build
        uses: php/php-windows-builder/extension@v1
        with:
          php-version: ${{ matrix.php-version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          libs: instantclient

  windows-release:
    runs-on: ubuntu-latest
    needs: windows
    if: ${{ github.event_name == 'release' }}
    steps:
      - name: Upload release artifact
        uses: php/php-windows-builder/release@v1
        with:
          release: ${{ github.event.release.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
